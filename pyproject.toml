[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "token-efficient-reasoning"
version = "0.1.0"
description = "Fixed-budget evaluation and post-training research for compact reasoning traces"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "accelerate>=1.6,<2",
  "numpy>=1.26,<3",
  "psutil>=6,<8",
  "safetensors>=0.5,<1",
  "torch>=2.6,<3",
  "transformers>=4.51,<5",
]

[project.optional-dependencies]
training = [
  "bitsandbytes>=0.45,<1; sys_platform == 'linux'",
  "peft>=0.15,<1",
]

[dependency-groups]
dev = [
  "pytest>=8.3,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.11,<1",
]

[project.scripts]
ter-eval = "token_efficient_reasoning.cli:main"
ter-data = "token_efficient_reasoning.controlled.cli:main"
ter-m2 = "token_efficient_reasoning.training.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/token_efficient_reasoning"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
markers = [
  "model: requires downloading a real model or tokenizer",
  "gpu: requires a CUDA GPU",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
